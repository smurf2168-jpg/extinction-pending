
name: Build Windows Overlay

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: ./extinction-pending-official-overlay

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Windows app
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Extinction-Pending-Windows
          path: |
            extinction-pending-official-overlay/dist/*.exe
            extinction-pending-official-overlay/dist/*.yml
            extinction-pending-official-overlay/dist/*.blockmap
          if-no-files-found: error
